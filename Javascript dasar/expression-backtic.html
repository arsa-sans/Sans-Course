<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expression Backtic</title>
</head>
<body>
  <script>
    const nilai = 90;
    const name = "Muhammad Arsa Prayata";
    const template = `Nama : ${name}, Lulus : ${nilai > 75}`;

    console.info(template)

    const multine = `Nama saya Muhammad Arsa Prayata,
sekarang lagi jadi siswa,
kalo ngantuk ya tidur.`;

    document.writeln("<pre>");
    document.writeln(multine)
    document.writeln("</pre>");
  </script>
</body>
</html>
