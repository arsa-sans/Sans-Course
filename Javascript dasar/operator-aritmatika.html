<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aritmatika</title>
</head>
<body>
  <script>

    let result = 2 + 3; // 5
    document.writeln(`1 + 2 = ${result}`);
    let originalResult = result; // 5

    document.writeln("<br>");
    
    result = result - 2; // 3
    document.writeln(`${originalResult} - 2 = ${result}`);
    originalResult = result; // 3
    
    document.writeln("<br>");
    
    result = result * 3; // 9
    document.writeln(`${originalResult} * 3 = ${result}`);

  </script>
</body>
</html>
