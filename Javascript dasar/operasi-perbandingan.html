<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operasi Perbandingan</title>
</head>
<body>
  <script>

    let result = 5 == "5";
    document.writeln("<p>" + result + " (kondisi 1)</p>");
    
    result = 5 === "5";
    document.writeln("<p>" + result + " (kondisi 2)</p>");
    
    result = 5 > 10;
    document.writeln("<p>" + result + " (kondisi 3)</p>");
    
    result = 5 < 10;
    document.writeln("<p>" + result + " (kondisi 4)</p>");
    
    result = 10 != 10;
    document.writeln("<p>" + result + " (kondisi 5)</p>");
    
    result = 10 != 9;
    document.writeln("<p>" + result + " (kondisi 6)</p>");
    
    result = 10 !== "10";
    document.writeln("<p>" + result + " (kondisi 7)</p>");
    
    result = 10 !== 10;
    document.writeln("<p>" + result + " (kondisi 8)</p>");
    
    result = 5 >= 5;
    document.writeln("<p>" + result + " (kondisi 9)</p>");
    
    result = 5 > 5;
    document.writeln("<p>" + result + " (kondisi 10)</p>");
    
    result = 5 <= 5;
    document.writeln("<p>" + result + " (kondisi 11)</p>");

    result = 5 < 5;
    document.writeln("<p>" + result + " (kondisi 12)</p>");

  </script>
</body>
</html>
